<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register | FashionCart Luxury Store</title>
  <link rel="icon" href="logo2.png" type="image/png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- AOS Scroll Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- FashionCart Luxury Design System -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">

  <script>
    const savedTheme = localStorage.getItem('fc_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px;
      position: relative;
    }

    .auth-nav-pill {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
      background: transparent;
    }

    .auth-nav-pill.active {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>

<body>

  <!-- Floating Home Link -->
  <a href="index.html" class="position-absolute top-0 start-0 m-3 m-md-4 btn btn-glass btn-sm" style="z-index: 10;">
    <i class="fas fa-arrow-left me-2"></i>Return to Store
  </a>

  <!-- Floating Theme Toggle Button -->
  <button class="position-absolute top-0 end-0 m-3 m-md-4 nav-action-btn theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" onclick="FashionUI.toggleTheme()" style="z-index: 10;">
    <i class="fas fa-sun text-warning"></i>
  </button>

  <div class="auth-container">
    <div class="auth-card" data-aos="zoom-in">
      <!-- Logo -->
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand-luxury d-inline-block mb-1">
          <i class="fas fa-gem gradient-text me-1"></i>Fashion<span>Cart</span>
        </a>
        <p class="text-secondary small">Access your personalized luxury portal</p>
      </div>

      <!-- Pill Nav Switcher -->
      <div class="d-flex p-1 mb-4 rounded-pill" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass);">
        <button class="auth-nav-pill active" id="pillLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-nav-pill" id="pillRegister" onclick="switchAuthTab('register')">Register</button>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div class="mb-4 p-3 rounded glass-card text-center" style="background: rgba(255, 75, 114, 0.08); border-color: rgba(255, 75, 114, 0.25);">
        <small class="text-muted d-block mb-2 fw-bold text-uppercase" style="font-size: 0.75rem;">1-Click Quick Testing Credentials</small>
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-sm btn-outline-danger px-3 py-1 rounded-pill" onclick="quickLogin('customer')">
            <i class="fas fa-user me-1"></i>Demo Customer
          </button>
          <button type="button" class="btn btn-sm btn-outline-warning px-3 py-1 rounded-pill" onclick="quickLogin('admin')">
            <i class="fas fa-shield-alt me-1"></i>Demo Admin
          </button>
        </div>
      </div>

      <!-- SIGN IN FORM -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control bg-dark text-light border-secondary" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn-luxury w-100 py-3 mt-3 font-display" id="loginBtn">
          Sign In to Account
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="d-none" onsubmit="handleRegisterSubmit(event)">
        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
            <input type="text" id="regName" class="form-control bg-dark text-light border-secondary" placeholder="e.g. John Doe" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
            <input type="email" id="regEmail" class="form-control bg-dark text-light border-secondary" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Phone Number (Optional)</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-phone"></i></span>
            <input type="tel" id="regPhone" class="form-control bg-dark text-light border-secondary" placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-light small fw-bold">Password (min 6 characters)</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" id="regPassword" class="form-control bg-dark text-light border-secondary" placeholder="Create strong password" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn-luxury w-100 py-3 mt-3 font-display" id="registerBtn">
          Create Free Account
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

  <script>
    AOS.init({ duration: 800, once: true });

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('pillLogin').classList.add('active');
        document.getElementById('pillRegister').classList.remove('active');
        document.getElementById('loginForm').classList.remove('d-none');
        document.getElementById('registerForm').classList.add('d-none');
      } else {
        document.getElementById('pillRegister').classList.add('active');
        document.getElementById('pillLogin').classList.remove('active');
        document.getElementById('registerForm').classList.remove('d-none');
        document.getElementById('loginForm').classList.add('d-none');
      }
    }

    function quickLogin(role) {
      switchAuthTab('login');
      if (role === 'admin') {
        document.getElementById('loginEmail').value = 'admin@fashioncart.com';
        document.getElementById('loginPassword').value = 'Admin@123';
      } else {
        document.getElementById('loginEmail').value = 'customer@fashioncart.com';
        document.getElementById('loginPassword').value = 'Customer@123';
      }
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;

      try {
        const res = await FashionAPI.auth.login(email, password);
        FashionUI.showToast(`Welcome back, ${res.user.name}!`, 'success');
        
        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 1000);
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = `Sign In to Account`;
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerBtn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

      try {
        const res = await FashionAPI.auth.register({ name, email, phone, password });
        FashionUI.showToast(`Account created! Welcome, ${res.user.name}!`, 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = `Create Free Account`;
      }
    }
  </script>
</body>

</html>
