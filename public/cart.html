<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | FashionCart Luxury Store</title>
  <link rel="icon" href="logo2.png" type="image/png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- AOS Scroll Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- FashionCart Luxury Design System -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">

  <script>
    const savedTheme = localStorage.getItem('fc_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>

  <style>
    .cart-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all var(--transition-fast);
    }

    .cart-item-card:hover {
      border-color: var(--border-glass-hover);
    }

    .cart-item-img {
      width: 90px;
      height: 110px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    @media (max-width: 575.98px) {
      .cart-item-card {
        padding: 12px !important;
        gap: 12px !important;
      }
      .cart-item-img {
        width: 68px !important;
        height: 84px !important;
      }
      .qty-display-sm {
        width: 24px !important;
      }
    }

    .qty-stepper-sm {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      padding: 2px 6px;
    }

    .qty-btn-sm {
      background: transparent;
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .qty-display-sm {
      width: 30px;
      text-align: center;
      font-weight: 700;
      color: #fff;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <!-- ==================== STICKY LUXURY NAVBAR ==================== -->
  <nav class="luxury-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-luxury">
        <i class="fas fa-gem gradient-text me-1"></i>Fashion<span>Cart</span>
      </a>

      <div class="d-none d-lg-flex align-items-center gap-1">
        <a href="index.html" class="nav-link-luxury">Home</a>
        <a href="shop.html" class="nav-link-luxury">All Collection</a>
        <a href="shop.html?category=men" class="nav-link-luxury">Men</a>
        <a href="shop.html?category=women" class="nav-link-luxury">Women</a>
        <a href="shop.html?category=ethnic" class="nav-link-luxury">Ethnic</a>
      </div>

      <div class="d-flex align-items-center gap-3">
        <!-- Theme Switcher Toggle -->
        <button class="nav-action-btn theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" onclick="FashionUI.toggleTheme()">
          <i class="fas fa-sun text-warning"></i>
        </button>

        <a href="wishlist.html" class="nav-action-btn" title="My Wishlist">
          <i class="far fa-heart"></i>
          <span class="nav-badge wishlist-count-badge" id="wishlistBadge" style="display: none;">0</span>
        </a>

        <a href="cart.html" class="nav-action-btn nav-cart-link" id="navCartBtn" title="Shopping Bag">
          <i class="fas fa-shopping-bag"></i>
          <span class="nav-badge cart-count-badge" id="cartBadge" style="display: none;">0</span>
        </a>

        <div id="navUserContainer">
          <a href="login.html" class="nav-action-btn" title="Sign In">
            <i class="fas fa-user"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ==================== CART VIEW ==================== -->
  <main class="py-5" style="margin-top: 76px; min-height: 70vh;">
    <div class="container">
      <h1 class="font-heading display-6 fw-bold text-white mb-4">Your Shopping Bag</h1>

      <div id="cartContentWrapper">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="luxury-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">© 2026 FashionCart Inc. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

  <script>
    let appliedCoupon = null;

    function renderCartPage() {
      const cart = FashionAPI.store.getCart();
      const container = document.getElementById('cartContentWrapper');

      if (!cart || cart.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-5 text-center my-4">
            <div class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: rgba(255, 75, 114, 0.1); color: var(--accent-rose); font-size: 2rem;">
              <i class="fas fa-shopping-bag"></i>
            </div>
            <h3 class="font-heading text-white mb-2">Your Bag is Empty</h3>
            <p class="text-secondary mb-4">Looks like you haven't added any luxury pieces yet.</p>
            <a href="shop.html" class="btn-luxury">
              <i class="fas fa-compass me-2"></i>Discover New Arrivals
            </a>
          </div>
        `;
        return;
      }

      const subtotal = FashionAPI.store.getCartSubtotal();
      const freeShippingThreshold = 999;
      const amountNeededForFreeShip = Math.max(0, freeShippingThreshold - subtotal);
      const shippingProgress = Math.min(100, (subtotal / freeShippingThreshold) * 100);
      const shippingFee = subtotal >= freeShippingThreshold ? 0 : 99;
      const tax = Math.round(subtotal * 0.05);
      const discount = appliedCoupon ? appliedCoupon.discountAmount : 0;
      const grandTotal = Math.max(0, subtotal + shippingFee + tax - discount);

      container.innerHTML = `
        <!-- Free Shipping Meter -->
        <div class="glass-card p-3 mb-4">
          <div class="d-flex justify-content-between mb-2 small fw-bold">
            <span class="text-light">
              <i class="fas fa-truck text-danger me-2"></i>
              ${amountNeededForFreeShip === 0 ? '<span class="text-success">🎉 Congratulations! You have unlocked FREE Express Delivery!</span>' : `Add <span class="text-warning">₹${amountNeededForFreeShip}</span> more to unlock <strong>FREE Express Shipping</strong>!`}
            </span>
            <span class="text-secondary">${Math.round(shippingProgress)}%</span>
          </div>
          <div class="progress" style="height: 8px; background: rgba(255,255,255,0.08);">
            <div class="progress-bar ${amountNeededForFreeShip === 0 ? 'bg-success' : 'bg-danger'}" style="width: ${shippingProgress}%"></div>
          </div>
        </div>

        <div class="row g-4">
          <!-- Items List -->
          <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3 text-secondary small">
              <span>ITEMS IN BAG (${FashionAPI.store.getCartCount()})</span>
              <button class="btn btn-sm btn-link text-danger text-decoration-none p-0" onclick="FashionAPI.store.clearCart(); renderCartPage();">Clear Bag</button>
            </div>

            ${cart.map(item => `
              <div class="cart-item-card">
                <img src="${item.image}" alt="${item.name}" class="cart-item-img" onerror="this.src='https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=100'">
                
                <div class="flex-grow-1">
                  <div class="d-flex justify-content-between align-items-start">
                    <div>
                      <a href="product.html?id=${item.productId}" class="fw-bold text-white text-decoration-none d-block mb-1" style="font-size: 1.05rem;">${item.name}</a>
                      <div class="d-flex gap-2 text-muted small mb-2">
                        <span>Size: <strong class="text-light">${item.selectedSize || 'M'}</strong></span>
                        <span>•</span>
                        <span>Color: <strong class="text-light">${item.selectedColor || 'Default'}</strong></span>
                      </div>
                    </div>
                    <button class="btn btn-link text-danger p-0" title="Remove item" onclick="FashionAPI.store.removeFromCart(${item.productId}, '${(item.selectedSize || '').replace(/'/g, "\\'")}', '${(item.selectedColor || '').replace(/'/g, "\\'")}'); renderCartPage();">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </div>

                  <div class="d-flex justify-content-between align-items-center mt-2">
                    <div class="qty-stepper-sm">
                      <button class="qty-btn-sm" onclick="FashionAPI.store.updateCartQuantity(${item.productId}, ${item.quantity - 1}, '${(item.selectedSize || '').replace(/'/g, "\\'")}', '${(item.selectedColor || '').replace(/'/g, "\\'")}'); renderCartPage();">-</button>
                      <span class="qty-display-sm">${item.quantity}</span>
                      <button class="qty-btn-sm" onclick="FashionAPI.store.updateCartQuantity(${item.productId}, ${item.quantity + 1}, '${(item.selectedSize || '').replace(/'/g, "\\'")}', '${(item.selectedColor || '').replace(/'/g, "\\'")}'); renderCartPage();">+</button>
                    </div>

                    <div class="text-end">
                      <span class="fw-bold text-white" style="font-size: 1.15rem; font-family: var(--font-display);">₹${item.price * item.quantity}</span>
                      ${item.originalPrice ? `<div class="text-muted small text-decoration-line-through">₹${item.originalPrice * item.quantity}</div>` : ''}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}

            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="shop.html" class="btn btn-glass btn-sm">
                <i class="fas fa-arrow-left me-2"></i>Continue Shopping
              </a>
            </div>
          </div>

          <!-- Order Summary Sidebar -->
          <div class="col-lg-4">
            <div class="glass-card p-4 sticky-top" style="top: 100px;">
              <h5 class="font-heading fw-bold text-white mb-4">Order Summary</h5>

              <!-- Promo Code Input -->
              <div class="mb-4">
                <label class="form-label text-light small fw-bold mb-1">Promo Code</label>
                <div class="input-group input-group-sm">
                  <input type="text" id="couponCodeInput" class="form-control bg-dark text-light border-secondary" placeholder="e.g. VOGUE20" value="${appliedCoupon ? appliedCoupon.code : ''}">
                  <button class="btn btn-outline-danger" onclick="applyCouponCode()">Apply</button>
                </div>
                ${appliedCoupon ? `<div class="text-success small mt-1 fw-bold"><i class="fas fa-check-circle me-1"></i>Code ${appliedCoupon.code} applied (-₹${appliedCoupon.discountAmount})</div>` : ''}
                <small class="text-muted d-block mt-1">Try: <strong>VOGUE20</strong> for 20% off</small>
              </div>

              <!-- Price Breakdown -->
              <div class="d-flex justify-content-between text-secondary mb-2 small">
                <span>Bag Subtotal</span>
                <span class="text-light fw-bold">₹${subtotal}</span>
              </div>

              <div class="d-flex justify-content-between text-secondary mb-2 small">
                <span>Estimated Shipping</span>
                <span class="${shippingFee === 0 ? 'text-success fw-bold' : 'text-light'}">${shippingFee === 0 ? 'FREE' : `₹${shippingFee}`}</span>
              </div>

              <div class="d-flex justify-content-between text-secondary mb-2 small">
                <span>Estimated GST (5%)</span>
                <span class="text-light">₹${tax}</span>
              </div>

              ${appliedCoupon ? `
                <div class="d-flex justify-content-between text-success mb-2 small fw-bold">
                  <span>Coupon Discount</span>
                  <span>-₹${discount}</span>
                </div>
              ` : ''}

              <hr class="border-secondary my-3">

              <div class="d-flex justify-content-between align-items-baseline mb-4">
                <span class="h6 fw-bold text-white mb-0">Total Amount</span>
                <span class="h4 fw-bold text-white mb-0" style="font-family: var(--font-display);">₹${grandTotal}</span>
              </div>

              <button class="btn-luxury w-100 py-3" onclick="proceedToCheckout()">
                Proceed to Checkout <i class="fas fa-lock ms-2"></i>
              </button>

              <div class="text-center mt-3 text-muted small">
                <i class="fas fa-shield-alt text-success me-1"></i> Bank-grade 256-bit encrypted checkout
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function applyCouponCode() {
      const code = document.getElementById('couponCodeInput').value.trim();
      if (!code) {
        FashionUI.showToast('Please enter a coupon code', 'error');
        return;
      }

      const subtotal = FashionAPI.store.getCartSubtotal();
      try {
        const res = await FashionAPI.coupons.validate(code, subtotal);
        appliedCoupon = res.coupon;
        localStorage.setItem('fc_applied_coupon', JSON.stringify(appliedCoupon));
        FashionUI.showToast(res.message, 'success');
        renderCartPage();
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
      }
    }

    function proceedToCheckout() {
      if (appliedCoupon) {
        localStorage.setItem('fc_applied_coupon', JSON.stringify(appliedCoupon));
      }
      window.location.href = 'checkout.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const savedCoupon = localStorage.getItem('fc_applied_coupon');
        if (savedCoupon) appliedCoupon = JSON.parse(savedCoupon);
      } catch (e) {}

      renderCartPage();
      window.addEventListener('cartUpdated', renderCartPage);
    });
  </script>
</body>

</html>
