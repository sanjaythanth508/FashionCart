<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | FashionCart Account</title>
  <link rel="icon" href="logo2.png" type="image/png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- FashionCart Luxury Design System -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">

  <script>
    const savedTheme = localStorage.getItem('fc_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body>

  <!-- ==================== STICKY LUXURY NAVBAR ==================== -->
  <nav class="luxury-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-luxury">
        <i class="fas fa-gem gradient-text me-1"></i>Fashion<span>Cart</span>
      </a>

      <div class="d-none d-lg-flex align-items-center gap-1">
        <a href="index.html" class="nav-link-luxury">Home</a>
        <a href="shop.html" class="nav-link-luxury">All Collection</a>
        <a href="my-orders.html" class="nav-link-luxury">My Orders</a>
        <a href="profile.html" class="nav-link-luxury active">Profile</a>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button class="nav-action-btn theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" onclick="FashionUI.toggleTheme()">
          <i class="fas fa-sun text-warning"></i>
        </button>

        <a href="wishlist.html" class="nav-action-btn" title="My Wishlist">
          <i class="far fa-heart"></i>
          <span class="nav-badge wishlist-count-badge" id="wishlistBadge" style="display: none;">0</span>
        </a>

        <a href="cart.html" class="nav-action-btn nav-cart-link" id="navCartBtn" title="Shopping Bag">
          <i class="fas fa-shopping-bag"></i>
          <span class="nav-badge cart-count-badge" id="cartBadge" style="display: none;">0</span>
        </a>

        <div id="navUserContainer"></div>
      </div>
    </div>
  </nav>

  <!-- ==================== PROFILE CONTAINER ==================== -->
  <main class="py-5" style="margin-top: 76px; min-height: 70vh;">
    <div class="container">
      <div id="profileContentWrapper">
        <div class="text-center py-5">
          <div class="spinner-border text-danger" role="status"></div>
          <p class="text-secondary mt-3">Loading profile data...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="luxury-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">© 2026 FashionCart Inc. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

  <script>
    async function loadUserProfile() {
      const container = document.getElementById('profileContentWrapper');

      if (!FashionAPI.auth.isLoggedIn()) {
        container.innerHTML = `
          <div class="glass-card p-5 text-center my-4">
            <i class="fas fa-user-lock fa-3x text-warning mb-3"></i>
            <h3 class="text-white">Account Login Required</h3>
            <p class="text-secondary mb-4">Please log in to manage your addresses, saved credentials, and profile settings.</p>
            <a href="login.html" class="btn-luxury">Sign In / Register</a>
          </div>
        `;
        return;
      }

      try {
        const res = await FashionAPI.auth.getProfile();
        const user = res.user;

        container.innerHTML = `
          <div class="row g-4">
            <!-- Left Sidebar Card -->
            <div class="col-lg-4">
              <div class="glass-card p-4 text-center">
                <img src="${user.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200'}" alt="${user.name}" class="rounded-circle shadow-lg mb-3" style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--accent-rose);">
                <h4 class="font-heading fw-bold text-white mb-1">${user.name}</h4>
                <p class="text-secondary small mb-2">${user.email}</p>
                <div>
                  ${user.role === 'admin' ? '<span class="badge bg-danger px-3 py-1 rounded-pill">ADMINISTRATOR</span>' : '<span class="badge bg-primary px-3 py-1 rounded-pill">VERIFIED MEMBER</span>'}
                </div>

                <hr class="border-secondary my-4">

                <div class="d-flex flex-column gap-2 text-start">
                  <a href="my-orders.html" class="btn btn-glass w-100 justify-content-start">
                    <i class="fas fa-box me-2 text-primary"></i>My Order History
                  </a>
                  <a href="wishlist.html" class="btn btn-glass w-100 justify-content-start">
                    <i class="fas fa-heart me-2 text-danger"></i>Saved Wishlist
                  </a>
                  ${user.role === 'admin' ? `
                    <a href="admin.html" class="btn btn-glass w-100 justify-content-start text-warning">
                      <i class="fas fa-shield-alt me-2"></i>Admin Dashboard
                    </a>
                  ` : ''}
                  <button class="btn btn-outline-danger w-100 justify-content-start mt-3" onclick="FashionAPI.auth.logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                  </button>
                </div>
              </div>
            </div>

            <!-- Right Content Tabs -->
            <div class="col-lg-8">
              <div class="glass-card p-4">
                <ul class="nav nav-pills mb-4 gap-2" id="profilePills" role="tablist">
                  <li class="nav-item">
                    <button class="btn btn-glass active" data-bs-toggle="pill" data-bs-target="#tabDetails">Personal Info</button>
                  </li>
                  <li class="nav-item">
                    <button class="btn btn-glass" data-bs-toggle="pill" data-bs-target="#tabAddresses">Saved Addresses</button>
                  </li>
                  <li class="nav-item">
                    <button class="btn btn-glass" data-bs-toggle="pill" data-bs-target="#tabPassword">Security</button>
                  </li>
                </ul>

                <div class="tab-content">
                  <!-- Personal Details -->
                  <div class="tab-pane fade show active" id="tabDetails">
                    <h5 class="font-heading fw-bold text-white mb-3">Edit Profile</h5>
                    <form onsubmit="handleUpdateProfile(event)">
                      <div class="row g-3">
                        <div class="col-md-6">
                          <label class="form-label text-light small fw-bold">Full Name</label>
                          <input type="text" id="profName" class="form-control bg-dark text-light border-secondary" value="${user.name || ''}" required>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label text-light small fw-bold">Email Address</label>
                          <input type="email" class="form-control bg-dark text-muted border-secondary" value="${user.email}" disabled>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label text-light small fw-bold">Phone Number</label>
                          <input type="tel" id="profPhone" class="form-control bg-dark text-light border-secondary" value="${user.phone || ''}" placeholder="e.g. +91 98765 43210">
                        </div>
                        <div class="col-md-6">
                          <label class="form-label text-light small fw-bold">Avatar URL</label>
                          <input type="url" id="profAvatar" class="form-control bg-dark text-light border-secondary" value="${user.avatar || ''}" placeholder="https://...">
                        </div>
                        <div class="col-12 mt-4">
                          <button type="submit" class="btn-luxury px-4">Save Changes</button>
                        </div>
                      </div>
                    </form>
                  </div>

                  <!-- Saved Addresses -->
                  <div class="tab-pane fade" id="tabAddresses">
                    <h5 class="font-heading fw-bold text-white mb-3">Saved Shipping Addresses</h5>
                    
                    <div id="addressList" class="mb-4">
                      ${(user.addresses && user.addresses.length > 0) ? user.addresses.map(a => `
                        <div class="p-3 mb-2 rounded glass-card border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                          <div>
                            <div class="fw-bold text-light">${a.title || 'Address'} ${a.isDefault ? '<span class="badge bg-success small">Default</span>' : ''}</div>
                            <div class="text-secondary small">${a.street}, ${a.city}, ${a.state} - ${a.postalCode}</div>
                            <div class="text-muted small">${a.country || 'India'} • ${a.phone || user.phone || ''}</div>
                          </div>
                        </div>
                      `).join('') : '<p class="text-muted small">No saved addresses yet.</p>'}
                    </div>

                    <h6 class="text-white fw-bold mt-4 mb-2">Add New Address</h6>
                    <form onsubmit="handleAddAddress(event)">
                      <div class="row g-2">
                        <div class="col-md-4">
                          <input type="text" id="addrTitle" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Label (Home/Office)" required>
                        </div>
                        <div class="col-md-8">
                          <input type="text" id="addrStreet" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Street Address" required>
                        </div>
                        <div class="col-md-4">
                          <input type="text" id="addrCity" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="City" required>
                        </div>
                        <div class="col-md-4">
                          <input type="text" id="addrState" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="State" required>
                        </div>
                        <div class="col-md-4">
                          <input type="text" id="addrPIN" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Postal Code" required>
                        </div>
                        <div class="col-12 mt-3">
                          <button type="submit" class="btn btn-luxury btn-sm">Save Address</button>
                        </div>
                      </div>
                    </form>
                  </div>

                  <!-- Security -->
                  <div class="tab-pane fade" id="tabPassword">
                    <h5 class="font-heading fw-bold text-white mb-3">Change Account Password</h5>
                    <form onsubmit="handleChangePassword(event)" style="max-width: 420px;">
                      <div class="mb-3">
                        <label class="form-label text-light small fw-bold">Current Password</label>
                        <input type="password" id="currPass" class="form-control bg-dark text-light border-secondary" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label text-light small fw-bold">New Password</label>
                        <input type="password" id="newPass" class="form-control bg-dark text-light border-secondary" required minlength="6">
                      </div>
                      <button type="submit" class="btn-luxury px-4">Update Password</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="glass-card p-5 text-center text-danger"><h5>Error loading profile: ${err.message}</h5></div>`;
      }
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profName').value;
      const phone = document.getElementById('profPhone').value;
      const avatar = document.getElementById('profAvatar').value;

      try {
        await FashionAPI.auth.updateProfile({ name, phone, avatar });
        FashionUI.showToast('Profile updated successfully!', 'success');
        loadUserProfile();
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
      }
    }

    async function handleAddAddress(e) {
      e.preventDefault();
      const title = document.getElementById('addrTitle').value;
      const street = document.getElementById('addrStreet').value;
      const city = document.getElementById('addrCity').value;
      const state = document.getElementById('addrState').value;
      const postalCode = document.getElementById('addrPIN').value;

      try {
        await FashionAPI.auth.addAddress({ title, street, city, state, postalCode, isDefault: true });
        FashionUI.showToast('Address added!', 'success');
        loadUserProfile();
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const currentPassword = document.getElementById('currPass').value;
      const newPassword = document.getElementById('newPass').value;

      try {
        await FashionAPI.auth.changePassword(currentPassword, newPassword);
        FashionUI.showToast('Password changed successfully!', 'success');
        document.getElementById('currPass').value = '';
        document.getElementById('newPass').value = '';
      } catch (err) {
        FashionUI.showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadUserProfile);
  </script>
</body>

</html>
