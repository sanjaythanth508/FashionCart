<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | VogueCart - Premium Fashion Store</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Range Slider -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/ion-rangeslider/2.3.1/css/ion.rangeSlider.min.css" />

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --secondary: #ff6b8b;
            --accent: #8a2be2;
            --light: #f8f9fa;
            --gray: #6c757d;
            --dark-gray: #343a40;
            --border: #e9ecef;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-gray);
            background: #fff;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        /* Navigation - Clean & Modern */
        .navbar {
            background: rgba(255, 255, 255, 0.98) !important;
            backdrop-filter: blur(10px);
            padding: 22px 0;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .navbar.scrolled {
            padding: 15px 0;
            box-shadow: var(--shadow-md);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 800;
            color: var(--primary) !important;
            position: relative;
        }

        .navbar-brand:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 40px;
            height: 2px;
            background: var(--secondary);
            transition: var(--transition);
        }

        .navbar-brand:hover:after {
            width: 100%;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-dark) !important;
            margin: 0 8px;
            padding: 10px 20px !important;
            border-radius: 50px;
            transition: var(--transition);
            position: relative;
            font-size: 15px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--secondary) !important;
            background: rgba(255, 51, 102, 0.05);
        }

        .nav-link.active {
            background: rgba(255, 51, 102, 0.1);
        }

        .nav-link:before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--secondary);
            transition: var(--transition);
        }

        .nav-link:hover:before,
        .nav-link.active:before {
            width: 30px;
        }

        /* Shop Header */
        .shop-header {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 120px 0 80px;
            margin-top: 76px;
        }

        .shop-header h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .breadcrumb {
            background: transparent;
            padding: 0;
            margin-bottom: 0;
        }

        .breadcrumb-item a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .breadcrumb-item.active {
            color: var(--secondary);
        }

        /* Shop Layout */
        .shop-container {
            padding: 80px 0;
            min-height: 100vh;
        }

        /* Filter Sidebar */
        .filter-sidebar {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 100px;
            margin-bottom: 30px;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .filter-title {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
        }

        .clear-filters {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .clear-filters:hover {
            color: var(--secondary);
        }

        .filter-section {
            margin-bottom: 30px;
        }

        .filter-section-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--dark-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 10px 0;
        }

        .filter-section-title i {
            transition: var(--transition);
        }

        .filter-section-title.collapsed i {
            transform: rotate(-90deg);
        }

        .filter-options {
            padding-left: 15px;
        }

        .form-check {
            margin-bottom: 12px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            margin-top: 0.2rem;
            border: 2px solid var(--border);
        }

        .form-check-input:checked {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }

        .form-check-label {
            margin-left: 8px;
            cursor: pointer;
            color: var(--gray);
            transition: var(--transition);
        }

        .form-check-label:hover {
            color: var(--primary);
        }

        /* Color Filter */
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border: 2px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .color-option.selected:after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Range Slider Custom */
        .irs--flat .irs-bar {
            background: var(--secondary);
        }

        .irs--flat .irs-handle {
            background: var(--secondary);
        }

        .irs--flat .irs-from,
        .irs--flat .irs-to,
        .irs--flat .irs-single {
            background: var(--secondary);
        }

        .price-range {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Products Section */
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .products-count {
            color: var(--gray);
            font-size: 1rem;
        }

        .product-description {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
        }

        .sort-options {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
        }

        .view-btn {
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            transition: var(--transition);
            cursor: pointer;
        }

        .view-btn.active,
        .view-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .sort-select {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--dark-gray);
            min-width: 180px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        /* List View */
        .products-grid.list-view {
            grid-template-columns: 1fr;
        }

        .product-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .products-grid:not(.list-view) .product-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow);
        }

        .products-grid.list-view .product-card {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .products-grid.list-view .product-card {
                grid-template-columns: 1fr;
            }
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
        }

        .product-image {
            height: 250px;
            overflow: hidden;
            position: relative;
        }

        .products-grid.list-view .product-image {
            height: 200px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .quick-view-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            color: var(--primary);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            z-index: 3;
        }

        .product-card:hover .quick-view-btn {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .product-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transform: translateX(20px);
            transition: var(--transition);
        }

        .product-card:hover .product-actions {
            opacity: 1;
            transform: translateX(0);
        }

        .action-btn {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-gray);
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .action-btn:hover {
            background: var(--secondary);
            color: white;
            transform: scale(1.1);
        }

        .action-btn.wishlisted {
            background: var(--secondary);
            color: white;
        }

        .product-info {
            padding: 20px;
        }

        .products-grid.list-view .product-info {
            padding: 30px;
        }

        .product-category {
            color: var(--gray);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .products-grid.list-view .product-title {
            font-size: 1.4rem;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .product-rating .stars {
            color: #ffc107;
        }

        .product-rating .count {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .product-description {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .current-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .products-grid.list-view .current-price {
            font-size: 1.5rem;
        }

        .old-price {
            font-size: 1rem;
            color: var(--gray);
            text-decoration: line-through;
        }

        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .add-to-cart:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .products-grid.list-view .add-to-cart {
            width: auto;
            min-width: 200px;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .pagination {
            display: flex;
            gap: 5px;
        }

        .page-item .page-link {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            color: var(--dark-gray);
            border-radius: 8px;
            transition: var(--transition);
        }

        .page-item.active .page-link {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-item:not(.active) .page-link:hover {
            background: var(--light);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        /* Quick View Modal */


        .modal-header {
            border-bottom: 1px solid var(--border);
            padding: 25px;
        }

        .modal-body {
            padding: 0;
        }

        .quick-view-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 992px) {
            .quick-view-content {
                grid-template-columns: 1fr;
            }
        }

        .quick-view-images {
            background: var(--light);
            padding: 40px;
        }

        .main-image img {
            width: 100%;
            border-radius: var(--radius);
        }

        .thumbnail-images {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .thumbnail {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
            transition: var(--transition);
        }

        .thumbnail.active {
            opacity: 1;
            border: 2px solid var(--secondary);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .quick-view-details {
            padding: 40px;
        }

        .product-title-modal {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .product-price-modal {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .product-colors,
        .product-sizes {
            margin-bottom: 25px;
        }

        .option-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark-gray);
        }

        .color-options-modal,
        .size-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .size-option {
            min-width: 45px;
            height: 45px;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .size-option:hover,
        .size-option.selected {
            border-color: var(--secondary);
            color: var(--secondary);
            background: rgba(255, 107, 139, 0.1);
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .quantity-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .quantity-input {
            width: 60px;
            height: 40px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .filter-sidebar {
                position: static;
                margin-bottom: 40px;
            }

            .shop-header h1 {
                font-size: 2.5rem;
            }

            .products-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .sort-options {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 576px) {

            .search-box {
                width: 250px;
            }

            .shop-header {
                padding: 80px 0 50px;
            }

            .shop-header h1 {
                font-size: 2rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, var(--secondary), var(--accent));
            border-radius: 4px;
        }

        /* Filter Toggle Button for Mobile */
        .filter-toggle-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-toggle-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .nav-icons .icon {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 50%;
            margin-left: 10px;
            color: var(--dark-gray);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }

        .nav-icons .icon:hover {
            background: var(--secondary);
            color: white;
            transform: translateY(-2px);
        }



        .nav-icons .icon {
            margin: 0;
            width: 50px;
            height: 50px;
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--secondary);
            color: white;
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #eee;
            border-radius: 30px;
            font-size: 14px;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.9);
        }

        .search-box input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }


        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .quick-view {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            cursor: pointer;
        }

        /* Remove focus / active / click border */
        .quick-view:focus,
        .quick-view:active,
        .quick-view:focus-visible {
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
            background: transparent;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: var(--gray);
            margin-bottom: 15px;
        }

        /* Cart Controls Styling */
        .cart-quantity-controls {
            background: white;
            padding: 2px;
            border-radius: 8px;
        }

        .cart-quantity-controls .btn-outline-secondary {
            border-color: #dee2e6;
            color: #495057;
            transition: all 0.2s ease;
        }

        .cart-quantity-controls .btn-outline-secondary:hover {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        .cart-quantity-controls .btn-danger {
            background: #dc3545;
            border-color: #dc3545;
        }

        .cart-quantity-controls .btn-danger:hover {
            background: #bb2d3b;
            border-color: #b02a37;
            transform: scale(0.95);
        }

        .add-to-cart {
            transition: all 0.3s ease;
        }

        .add-to-cart:hover {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }

        /* Modal Cart Controls */
        .modal-cart-controls .btn-outline-success,
        .modal-cart-controls .btn-outline-danger,

            transform: translateY(-2px);
        }

            background: #dc3545;
            color: white;
            transform: translateY(-2px);
        }

        .modal-cart-controls .form-control:focus {
            box-shadow: none;
            border-color: var(--secondary);
        }

        #modalCartQuantity {
            display: inline-block;
            min-width: 40px;
            font-size: 16px;
        }

        .alert-success {
            background: linear-gradient(45deg, #d4edda, #c3e6cb);
            border-color: #28a745;
            color: #155724;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>

                const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const userWishlist = fullWishlist.filter(item => item.uid === currentUser.id);
                wishlist = userWishlist.map(item => item.id);

                // Cart - filter by current user
                const fullCart = JSON.parse(localStorage.getItem('cart')) || [];
                cart = fullCart.filter(item => item.user === currentUser.id);
            } else {
                wishlist = [];
                cart = [];
            }

            // Initialize Range Slider
            $("#priceRange").ionRangeSlider({
                type: "double",
                min: 0,
                max: 1000,
                from: 0,
                to: 1000,
                prefix: "₹",
                onFinish: function (data) {
                    currentFilters.minPrice = data.from;
                    currentFilters.maxPrice = data.to;
                    document.getElementById('minPrice').textContent = '₹' + data.from;
                    document.getElementById('maxPrice').textContent = '₹' + data.to;
                    filterProducts();
                }
            });

            // Initial render
            filteredProducts = [...products];
            renderProducts();
            generatePagination(products.length);
            updateProductCount(products.length);
            updateCartCount();
            updateWishlistCount();
            setupEventListeners();

            // Navbar scroll effect
            window.addEventListener('scroll', function () {
                const navbar = document.querySelector('.navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        });

        // Setup Event Listeners
        function setupEventListeners() {
            // View Toggle
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    this.classList.add('active');
                    currentView = this.dataset.view;
                    document.getElementById('productsGrid').className = `products-grid ${currentView === 'list' ? 'list-view' : ''}`;
                    renderProducts();
                });
            });

            // Sort Select
            document.getElementById('sortSelect').addEventListener('change', function () {
                currentSort = this.value;
                filterProducts();
            });

            // Category Filters
            document.querySelectorAll('[data-category]').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    if (this.id === 'catAll' && this.checked) {
                        document.querySelectorAll('[data-category]').forEach(cb => {
                            if (cb.id !== 'catAll') cb.checked = false;
                        });
                        currentFilters.categories = ['all'];
                    } else {
                        document.getElementById('catAll').checked = false;
                        const category = this.dataset.category;
                        if (this.checked) {
                            if (!currentFilters.categories.includes(category)) {
                                currentFilters.categories.push(category);
                            }
                        } else {
                            currentFilters.categories = currentFilters.categories.filter(c => c !== category);
                        }

                        if (currentFilters.categories.length === 0) {
                            document.getElementById('catAll').checked = true;
                            currentFilters.categories = ['all'];
                        }
                    }
                    filterProducts();
                });
            });

            // Color Filters
            document.querySelectorAll('.color-option').forEach(color => {
                color.addEventListener('click', function () {
                    this.classList.toggle('selected');
                    const colorValue = this.dataset.color;

                    if (this.classList.contains('selected')) {
                        if (!currentFilters.colors.includes(colorValue)) {
                            currentFilters.colors.push(colorValue);
                        }
                    } else {
                        currentFilters.colors = currentFilters.colors.filter(c => c !== colorValue);
                    }
                    filterProducts();
                });
            });

            // Size Filters
            document.querySelectorAll('[data-size]').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const size = this.dataset.size;
                    if (this.checked) {
                        if (!currentFilters.sizes.includes(size)) {
                            currentFilters.sizes.push(size);
                        }
                    } else {
                        currentFilters.sizes = currentFilters.sizes.filter(s => s !== size);
                    }
                    filterProducts();
                });
            });

            // Brand Filters
            document.querySelectorAll('[data-brand]').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const brand = this.dataset.brand;
                    if (this.checked) {
                        if (!currentFilters.brands.includes(brand)) {
                            currentFilters.brands.push(brand);
                        }
                    } else {
                        currentFilters.brands = currentFilters.brands.filter(b => b !== brand);
                    }
                    filterProducts();
                });
            });

            // Rating Filters
            document.querySelectorAll('[data-rating]').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const rating = parseInt(this.dataset.rating);
                    if (this.checked) {
                        if (!currentFilters.ratings.includes(rating)) {
                            currentFilters.ratings.push(rating);
                        }
                    } else {
                        currentFilters.ratings = currentFilters.ratings.filter(r => r !== rating);
                    }
                    filterProducts();
                });
            });

            // Clear Filters
            document.getElementById('clearFilters').addEventListener('click', function (e) {
                e.preventDefault();
                clearAllFilters();
            });

            // Filter Toggle (Mobile)
            document.getElementById('filterToggle').addEventListener('click', function () {
                const sidebar = document.getElementById('filterSidebar');
                sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
            });

            // Window resize for mobile filter
            window.addEventListener('resize', function () {
                const sidebar = document.getElementById('filterSidebar');
                if (window.innerWidth >= 992) {
                    sidebar.style.display = 'block';
                }
            });
        }

        // ============ LOGIN CHECK FUNCTIONS ============
        function isUserLoggedIn() {
            const currentUser = localStorage.getItem('currentUser');
            return currentUser && JSON.parse(currentUser).id ? true : false;
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('currentUser'));
        }

        // ============ CART FUNCTIONS ============
        function getCartItem(productId) {
            if (!isUserLoggedIn()) return null;
            const currentUser = getCurrentUser();
            const fullCart = JSON.parse(localStorage.getItem('cart')) || [];
            return fullCart.find(item => item.id === productId && item.user === currentUser.id) || null;
        }

        function isProductInCart(productId) {
            return !!getCartItem(productId);
        }

        function addToCart(productId, button = null) {
            if (!isUserLoggedIn()) {
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) return;

            const currentUser = getCurrentUser();
            let fullCart = JSON.parse(localStorage.getItem('cart')) || [];

            const existingItemIndex = fullCart.findIndex(item =>
                item.id === productId && item.user === currentUser.id
            );

            if (existingItemIndex !== -1) {
                // Increase quantity
                fullCart[existingItemIndex].quantity = (fullCart[existingItemIndex].quantity || 1) + 1;
                showNotification('Cart updated! Quantity increased.', 'success');
            } else {
                // Add new item
                fullCart.push({
                    ...product,
                    quantity: 1,
                    user: currentUser.id,
                    addedAt: new Date().toISOString(),
                    selectedColor: product.colors[0] || 'black',
                    selectedSize: product.sizes[0] || 'M'
                });
                showNotification(`${product.name} added to cart!`, 'success');
            }

            // Save to localStorage
            localStorage.setItem('cart', JSON.stringify(fullCart));

            // Update global cart array
            cart = fullCart.filter(item => item.user === currentUser.id);

            // Update cart count badge
            updateCartCount();

            // INSTANTLY update the specific product card UI
            updateProductCardUI(productId);

            // Button animation if button is provided
            if (button) {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check"></i> Added!';
                button.style.background = 'var(--secondary)';

                setTimeout(() => {
                    button.innerHTML = '<i class="fas fa-shopping-cart me-2"></i> Add to Cart';
                    button.style.background = '';
                }, 2000);
            }
        }

        function removeFromCart(productId, showMessage = true) {
            if (!isUserLoggedIn()) return;

            const currentUser = getCurrentUser();
            let fullCart = JSON.parse(localStorage.getItem('cart')) || [];
            const product = products.find(p => p.id === productId);

            // Remove only current user's instance
            fullCart = fullCart.filter(item =>
                !(item.id === productId && item.user === currentUser.id)
            );

            // Save to localStorage
            localStorage.setItem('cart', JSON.stringify(fullCart));

            // Update global cart array
            cart = fullCart.filter(item => item.user === currentUser.id);

            // Update cart count badge
            updateCartCount();

            if (showMessage) {
                showNotification(`${product?.name || 'Product'} removed from cart!`, 'info');
            }

            // INSTANTLY update the specific product card UI
            updateProductCardUI(productId);
        }

        function updateCartQuantity(productId, newQuantity) {
            if (!isUserLoggedIn()) return;

            const currentUser = getCurrentUser();
            let fullCart = JSON.parse(localStorage.getItem('cart')) || [];

            const itemIndex = fullCart.findIndex(item =>
                item.id === productId && item.user === currentUser.id
            );

            if (itemIndex !== -1) {
                if (newQuantity <= 0) {
                    // Remove if quantity is 0 or less
                    removeFromCart(productId, true);
                    return;
                } else {
                    // Update quantity
                    fullCart[itemIndex].quantity = newQuantity;

                    // Save to localStorage
                    localStorage.setItem('cart', JSON.stringify(fullCart));

                    // Update global cart array
                    cart = fullCart.filter(item => item.user === currentUser.id);

                    // Update cart count badge
                    updateCartCount();

                    // INSTANTLY update the specific product card UI
                    updateProductCardUI(productId);

                    showNotification('Cart updated!', 'success');
                }
            }
        }

        function increaseCartQuantity(productId) {
            const cartItem = getCartItem(productId);
            if (cartItem) {
                updateCartQuantity(productId, (cartItem.quantity || 1) + 1);
            }
        }

        function decreaseCartQuantity(productId) {
            const cartItem = getCartItem(productId);
            if (cartItem) {
                const newQuantity = (cartItem.quantity || 1) - 1;
                if (newQuantity <= 0) {
                    removeFromCart(productId, true);
                } else {
                    updateCartQuantity(productId, newQuantity);
                }
            }
        }

        function updateProductCardUI(productId) {
            // Find ALL product cards with this ID (for grid and list views)
            const productCards = document.querySelectorAll(`.product-card[data-product-id="${productId}"]`);
            if (!productCards.length) return;

            const product = products.find(p => p.id === productId);
            if (!product) return;

            const cartItem = getCartItem(productId);
            const isInCart = !!cartItem;
            const itemQuantity = cartItem?.quantity || 1;

            // Update each instance of the product card
            productCards.forEach(productCard => {
                const cartSection = productCard.querySelector('.cart-section');
                if (!cartSection) return;

                if (isInCart) {
                    cartSection.innerHTML = `
                <div class="cart-quantity-controls d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center border rounded">
                        <button class="btn btn-sm btn-outline-secondary decrease-cart border-0" 
                                data-product-id="${productId}" 
                                style="width: 35px; height: 35px; padding: 0;">
                            <i class="fas fa-minus"></i>
                        </button>
                        <span class="mx-2 fw-bold" style="min-width: 30px; text-align: center; font-size: 14px;">${itemQuantity}</span>
                        <button class="btn btn-sm btn-outline-secondary increase-cart border-0" 
                                data-product-id="${productId}"
                                style="width: 35px; height: 35px; padding: 0;">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <button class="btn btn-sm btn-danger remove-from-cart ms-2" 
                            data-product-id="${productId}"
                            style="width: 35px; height: 35px; padding: 0;"
                            title="Remove from cart">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="mt-2 text-success small">
                    <i class="fas fa-check-circle me-1"></i> In Cart
                </div>
            `;
                } else {
                    cartSection.innerHTML = `
                <button class="add-to-cart btn btn-dark w-100" data-product-id="${productId}">
                    <i class="fas fa-shopping-cart me-2"></i> Add to Cart
                </button>
            `;
                }

                // Reattach event listeners to this specific card
                attachCartEventsToElement(productCard, productId);
            });
        }

        function attachCartEventsToElement(element, productId) {
            // Remove existing event listeners by cloning and replacing
            const addBtn = element.querySelector('.add-to-cart');
            if (addBtn) {
                const newAddBtn = addBtn.cloneNode(true);
                addBtn.parentNode.replaceChild(newAddBtn, addBtn);
                newAddBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    addToCart(productId, newAddBtn);
                });
            }

            const removeBtn = element.querySelector('.remove-from-cart');
            if (removeBtn) {
                const newRemoveBtn = removeBtn.cloneNode(true);
                removeBtn.parentNode.replaceChild(newRemoveBtn, removeBtn);
                newRemoveBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    removeFromCart(productId, true);
                });
            }

            const increaseBtn = element.querySelector('.increase-cart');
            if (increaseBtn) {
                const newIncreaseBtn = increaseBtn.cloneNode(true);
                increaseBtn.parentNode.replaceChild(newIncreaseBtn, increaseBtn);
                newIncreaseBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    increaseCartQuantity(productId);
                });
            }

            const decreaseBtn = element.querySelector('.decrease-cart');
            if (decreaseBtn) {
                const newDecreaseBtn = decreaseBtn.cloneNode(true);
                decreaseBtn.parentNode.replaceChild(newDecreaseBtn, decreaseBtn);
                newDecreaseBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    decreaseCartQuantity(productId);
                });
            }
        }

        // ============ WISHLIST FUNCTIONS ============
        function toggleWishlist(productId, element) {
            if (!isUserLoggedIn()) {
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return;
            }

            const index = wishlist.indexOf(productId);
            const icon = element.querySelector('i');
            const currentUser = getCurrentUser();
            const product = products.find(p => p.id === productId);

            if (index === -1) {
                if (product) {
                    const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                    fullWishlist.push({
                        ...product,
                        uid: currentUser.id,
                        addedAt: new Date().toISOString()
                    });
                    localStorage.setItem('wishlist', JSON.stringify(fullWishlist));

                    wishlist.push(productId);
                    element.classList.add('wishlisted');
                    icon.className = 'fas fa-heart';
                    showNotification(`${product.name} added to wishlist!`, 'success');
                    updateWishlistCount();
                }
            } else {
                const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const updatedWishlist = fullWishlist.filter(item =>
                    !(item.id === productId && item.uid === currentUser.id)
                );
                localStorage.setItem('wishlist', JSON.stringify(updatedWishlist));

                wishlist.splice(index, 1);
                element.classList.remove('wishlisted');
                icon.className = 'far fa-heart';
                showNotification(`${product?.name || 'Product'} removed from wishlist!`, 'info');
                updateWishlistCount();
            }
        }

        function updateWishlistCount() {
            if (!isUserLoggedIn()) {
                document.querySelectorAll('#wishlistCountDesktop').forEach(badge => {
                    badge.textContent = '0';
                });
                return;
            }

            const currentUser = getCurrentUser();
            const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const userWishlist = fullWishlist.filter(item => item.uid === currentUser.id);
            wishlist = userWishlist.map(item => item.id);

            const wishlistCount = userWishlist.length;
            document.querySelectorAll('#wishlistCountDesktop').forEach(badge => {
                badge.textContent = wishlistCount;
            });
        }

        function updateCartCount() {
            if (!isUserLoggedIn()) {
                document.querySelectorAll('#cartCountDesktop').forEach(badge => {
                    badge.textContent = '0';
                });
                return;
            }

            const currentUser = getCurrentUser();
            const fullCart = JSON.parse(localStorage.getItem('cart')) || [];
            const userCart = fullCart.filter(item => item.user === currentUser.id);
            cart = userCart;

            const totalItems = userCart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.querySelectorAll('#cartCountDesktop').forEach(badge => {
                badge.textContent = totalItems;
            });
        }

        function showNotification(message, type = 'success') {
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) existingNotification.remove();

            const notification = document.createElement('div');
            notification.className = `notification position-fixed top-0 end-0 m-3 p-3 bg-${type === 'success' ? 'success' : type === 'info' ? 'info' : 'danger'} text-white rounded shadow`;
            notification.style.zIndex = '9999';
            notification.innerHTML = `
        <div class="d-flex align-items-center">
            <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle'} me-2"></i>
            <span>${message}</span>
        </div>
    `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Filter Products
        function filterProducts() {
            const searchTerm = document.querySelector('.search-box input')?.value.toLowerCase() || '';

            let filtered = products.filter(product => {
                // Search Filter
                if (searchTerm && !product.name.toLowerCase().includes(searchTerm) &&
                    !product.description.toLowerCase().includes(searchTerm)) {
                    return false;
                }

                // Category Filter
                if (!currentFilters.categories.includes('all') &&
                    !currentFilters.categories.includes(product.category)) {
                    return false;
                }

                // Price Filter
                const price = parseFloat(product.price) || 0;
                if (price < currentFilters.minPrice || price > currentFilters.maxPrice) {
                    return false;
                }

                // Color Filter
                if (currentFilters.colors.length > 0) {
                    const hasColor = product.colors.some(color => currentFilters.colors.includes(color));
                    if (!hasColor) return false;
                }

                // Size Filter
                if (currentFilters.sizes.length > 0) {
                    const hasSize = product.sizes.some(size => currentFilters.sizes.includes(size));
                    if (!hasSize) return false;
                }

                // Brand Filter
                if (currentFilters.brands.length > 0) {
                    const hasBrand = product.brand && currentFilters.brands.includes(product.brand);
                    if (!hasBrand) return false;
                }

                // Rating Filter
                if (currentFilters.ratings.length > 0) {
                    const meetsRating = currentFilters.ratings.some(rating => product.rating >= rating);
                    if (!meetsRating) return false;
                }

                return true;
            });

            // Sort Products
            filtered = sortProducts(filtered, currentSort);

            // Reset to page 1 when filtering
            currentPage = 1;

            // Update filtered products
            filteredProducts = filtered;

            // Render filtered products with pagination
            renderProducts();
            generatePagination(filtered.length);
        }

        // Sort Products
        function sortProducts(productsToSort, sortType) {
            const sorted = [...productsToSort];

            switch (sortType) {
                case 'price-low':
                    return sorted.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
                case 'price-high':
                    return sorted.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
                case 'newest':
                    return sorted.sort((a, b) => b.id - a.id);
                case 'rating':
                    return sorted.sort((a, b) => b.rating - a.rating);
                case 'popular':
                    return sorted.sort((a, b) => b.reviews - a.reviews);
                default:
                    return sorted;
            }
        }

        // Render Products with Pagination
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');

            if (filteredProducts.length === 0) {
                grid.innerHTML = '';
                loading.classList.add('d-none');
                emptyState.classList.remove('d-none');
                generatePagination(0);
                return;
            }

            emptyState.classList.add('d-none');
            loading.classList.remove('d-none');

            setTimeout(() => {
                grid.innerHTML = '';

                // Calculate which products to show for current page
                const startIndex = (currentPage - 1) * productsPerPage;
                const endIndex = Math.min(startIndex + productsPerPage, filteredProducts.length);
                const productsToShow = filteredProducts.slice(startIndex, endIndex);

                productsToShow.forEach(product => {
                    const productHTML = createProductHTML(product);
                    grid.innerHTML += productHTML;
                });

                loading.classList.add('d-none');

                // Setup all interactions
                setupProductInteractions();

                // Update product count to show current page range
                updateProductCount(filteredProducts.length, startIndex + 1, endIndex);
            }, 300);
        }

        // Create Product HTML

                    <i class="fas fa-trash-alt"></i>

            </div>
            <div class="mt-2 text-success small">

            } else {
                cartButtonHTML = `
            <button class="add-to-cart btn btn-dark w-100" data-product-id="${product.id}">

            <div class="product-info">

                <div class="product-price">

        function goToPage(page) {
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderProducts();
            generatePagination(filteredProducts.length);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Generate Pagination
        function generatePagination(totalItems) {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(totalItems / productsPerPage);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';

            // Previous button
            const prevDisabled = currentPage === 1 ? 'disabled' : '';
            html += `
            <li class="page-item ${prevDisabled}">
                <a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
        `;

            // Show page numbers
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            if (currentPage <= 3) {
                endPage = Math.min(5, totalPages);
            }

            if (currentPage >= totalPages - 2) {
                startPage = Math.max(1, totalPages - 4);
            }

            if (startPage > 1) {
                html += `
                <li class="page-item ${currentPage === 1 ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(1); return false;">1</a>
                </li>
            `;
                if (startPage > 2) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `
                <li class="page-item ${currentPage === i ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>
                </li>
            `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
                html += `
                <li class="page-item ${currentPage === totalPages ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${totalPages}); return false;">${totalPages}</a>
                </li>
            `;
            }

            // Next button
            const nextDisabled = currentPage === totalPages ? 'disabled' : '';
            html += `
            <li class="page-item ${nextDisabled}">
                <a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        `;

            pagination.innerHTML = html;
        }

                const newBtn = btn.cloneNode(true);

        function toggleWishlist(productId, element) {
            const index = wishlist.indexOf(productId);
            const icon = element.querySelector('i');

            if (index === -1) {
                // Add to wishlist
                const product = products.find(p => p.id === productId);
                if (product) {
                    const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                    fullWishlist.push(product);
                    localStorage.setItem('wishlist', JSON.stringify(fullWishlist));

                    wishlist.push(productId);
                    element.classList.add('wishlisted');
                    icon.className = 'fas fa-heart';
                    showNotification('Added to wishlist!');

                    // Update wishlist count
                    updateWishlistCount();
                }
            } else {
                // Remove from wishlist
                const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const updatedWishlist = fullWishlist.filter(item => item.id !== productId);
                localStorage.setItem('wishlist', JSON.stringify(updatedWishlist));

                wishlist.splice(index, 1);
                element.classList.remove('wishlisted');

            let cart = c.filter(item => item.user === JSON.parse(localStorage.getItem('currentUser'))['id']);

                    ...product,
                    user: JSON.parse(localStorage.getItem('currentUser'))['id'],
                    quantity: 1,
                    selectedColor: product.colors[0] || 'black',
                    selectedSize: product.sizes[0] || 'M'

            const fullCart = JSON.parse(localStorage.getItem('cart')) || [];
            const userCart = fullCart.filter(item => item.user === currentUser.id);

            const index = wishlist.indexOf(productId);
            const btn = document.querySelector('.btn-outline-dark');
            const icon = btn?.querySelector('i');
            const product = products.find(p => p.id === productId);

            if (index === -1) {
                const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                fullWishlist.push({
                    ...product,
                    uid: currentUser.id,
                    addedAt: new Date().toISOString()
                });
                localStorage.setItem('wishlist', JSON.stringify(fullWishlist));

                wishlist.push(productId);
                if (icon) icon.className = 'fas fa-heart me-2';
                showNotification(`${product?.name} added to wishlist!`, 'success');
                updateWishlistCount();
            } else {
                const fullWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const updatedWishlist = fullWishlist.filter(item =>
                    !(item.id === productId && item.uid === currentUser.id)
                );
                localStorage.setItem('wishlist', JSON.stringify(updatedWishlist));

                wishlist.splice(index, 1);
                if (icon) icon.className = 'far fa-heart me-2';
                showNotification(`${product?.name} removed from wishlist!`, 'info');
                updateWishlistCount();
            }
        };
    </script>
</body>

</html>
